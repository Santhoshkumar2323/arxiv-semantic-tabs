name: Refresh arXiv Papers

on:
  schedule:
    - cron: '0 3 */2 * *'
  workflow_dispatch: {}  

permissions:
  contents: write  

concurrency:
  group: arxiv-refresh
  cancel-in-progress: false  

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30  

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract embedding model name
        id: model_name
        run: |
          MODEL=$(python -c "import yaml; print(yaml.safe_load(open('config/sectors.yaml'))['embedding_model'])")
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ steps.model_name.outputs.model }}

      - name: Run pipeline
        run: python -m pipeline.run_pipeline

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/papers.json data/run_log.json
          git diff --staged --quiet || git commit -m "Refresh papers: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push